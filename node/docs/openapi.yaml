openapi: 3.1.0
info:
  title: FileHarbor file management API
  version: 0.1.0
  description: File and directory management over HTTP. See api.md for the panel API. Default file limit is 25 MiB; supported media includes MP4.
servers:
  - url: /fileharbor/{account_id}/api
    variables:
      account_id:
        default: YOUR_ACCOUNT_ID
security:
  - bearerKey: []
paths:
  /{account_id}/{source}:
    servers:
      - url: /
    parameters:
      - name: account_id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{22}$' }
      - name: source
        in: path
        required: true
        description: Account-relative file path, including any folders.
        schema: { type: string }
    get:
      operationId: getPublicFile
      security: []
      description: Public file bytes. Enabled by default; SERVE_FILES=false disables this route. Supports a single byte range and conditional requests. Account revocation does not revoke public access.
      parameters:
        - name: Range
          in: header
          schema: { type: string, example: 'bytes=0-1023' }
        - name: If-None-Match
          in: header
          schema: { type: string }
        - name: If-Modified-Since
          in: header
          schema: { type: string }
        - name: If-Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: File content with detected Content-Type, Content-Length, ETag, Last-Modified, and Accept-Ranges headers.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content with Content-Range and Content-Length headers.
        '304':
          description: Not modified; no response body.
        '416':
          description: Unsatisfiable range; Content-Range contains bytes */SIZE.
        default:
          $ref: '#/components/responses/Error'
    head:
      operationId: headPublicFile
      security: []
      description: Public file headers without a body. Disabled when SERVE_FILES=false.
      responses:
        '200':
          description: File headers; no response body.
        '304':
          description: Not modified; no response body.
        default:
          $ref: '#/components/responses/Error'
  /upload:
    post:
      operationId: uploadFile
      description: Requires files:upload. Directory must exist. No overwrites. MIME content and filename extension must match the configured allowlist.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                folder:
                  type: string
                  default: ''
                file_name:
                  type: string
                  description: Overrides the multipart filename. Single safe filename segment.
      responses:
        '201':
          description: File stored
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [file_name, source, mime_type, size]
                    properties:
                      file_name: { type: string }
                      source: { type: string }
                      mime_type: { type: string }
                      size: { type: integer, minimum: 0 }
        default:
          $ref: '#/components/responses/Error'
  /files:
    get:
      operationId: listFiles
      description: Requires files:list. Non-recursive, filename-sorted listing of files and directories; no snapshot guarantee.
      parameters:
        - $ref: '#/components/parameters/Folder'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Listing'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteFile
      description: Requires files:delete. Deletes an exact account-relative file path.
      requestBody:
        $ref: '#/components/requestBodies/Source'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        default:
          $ref: '#/components/responses/Error'
  /directories:
    post:
      operationId: createDirectory
      description: Requires directories:create. Creates parents; existing directories succeed.
      requestBody:
        $ref: '#/components/requestBodies/Source'
      responses:
        '201':
          description: Directory exists
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [created]
                    properties:
                      created: { const: true }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listDirectories
      description: Requires directories:list. Same listing shape, filtered to directories before pagination.
      parameters:
        - $ref: '#/components/parameters/Folder'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Listing'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteDirectory
      description: Requires directories:delete. Deletes empty directories by default. Set recursive to true to permanently delete the directory and all its contents. The account root cannot be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  description: Directory path relative to the account root.
                recursive:
                  type: boolean
                  default: false
                  description: Delete all files and nested directories when true.
            example:
              source: assets
              recursive: true
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
  parameters:
    Folder:
      name: folder
      in: query
      schema: { type: string, default: '' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  requestBodies:
    Source:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [source]
            properties:
              source: { type: string, minLength: 1, maxLength: 1024 }
  responses:
    Error:
      description: Error codes and HTTP mappings are specified in api.md. No internal paths or secrets are exposed.
      content:
        application/json:
          schema:
            type: object
            required: [success, error]
            properties:
              success: { const: false }
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
    Deleted:
      description: Entry deleted
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data:
                type: object
                required: [deleted]
                properties:
                  deleted: { const: true }
    Listing:
      description: Paginated filesystem listing
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [file_name, source, type, size]
                      properties:
                        file_name: { type: string }
                        source: { type: string }
                        type: { enum: [file, directory] }
                        size: { type: integer, minimum: 0 }
                  pagination:
                    type: object
                    required: [page, limit, total]
                    properties:
                      page: { type: integer, minimum: 1 }
                      limit: { type: integer, minimum: 1, maximum: 100 }
                      total: { type: integer, minimum: 0 }
