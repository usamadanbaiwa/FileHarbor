openapi: 3.1.0
info:
  title: FileHarbor file management API
  version: 0.1.0
  description: File and directory management over HTTP. See api.md for the panel API. Default file limit is 25 MiB; supported media includes MP4.
servers:
  - url: /fileharbor/{account_id}/api
    variables:
      account_id:
        default: YOUR_ACCOUNT_ID
security:
  - bearerKey: []
paths:
  /upload:
    post:
      operationId: uploadFile
      description: Requires files:upload. Directory must exist. No overwrites. MIME content and filename extension must match the configured allowlist.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                folder:
                  type: string
                  default: ''
                file_name:
                  type: string
                  description: Overrides the multipart filename. Single safe filename segment.
      responses:
        '201':
          description: File stored
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [file_name, source, mime_type, size]
                    properties:
                      file_name: { type: string }
                      source: { type: string }
                      mime_type: { type: string }
                      size: { type: integer, minimum: 0 }
        default:
          $ref: '#/components/responses/Error'
  /files:
    get:
      operationId: listFiles
      description: Requires files:list. Non-recursive, filename-sorted listing of files and directories; no snapshot guarantee.
      parameters:
        - $ref: '#/components/parameters/Folder'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Listing'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteFile
      description: Requires files:delete. Deletes an exact account-relative file path.
      requestBody:
        $ref: '#/components/requestBodies/Source'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        default:
          $ref: '#/components/responses/Error'
  /directories:
    post:
      operationId: createDirectory
      description: Requires directories:create. Creates parents; existing directories succeed.
      requestBody:
        $ref: '#/components/requestBodies/Source'
      responses:
        '201':
          description: Directory exists
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [created]
                    properties:
                      created: { const: true }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listDirectories
      description: Requires directories:list. Same listing shape, filtered to directories before pagination.
      parameters:
        - $ref: '#/components/parameters/Folder'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Listing'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteDirectory
      description: Requires directories:delete. Empty directories only; account root cannot be deleted. The recursive option is not implemented.
      requestBody:
        $ref: '#/components/requestBodies/Source'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
  parameters:
    Folder:
      name: folder
      in: query
      schema: { type: string, default: '' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  requestBodies:
    Source:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [source]
            properties:
              source: { type: string, minLength: 1, maxLength: 1024 }
  responses:
    Error:
      description: Error codes and HTTP mappings are specified in api.md. No internal paths or secrets are exposed.
      content:
        application/json:
          schema:
            type: object
            required: [success, error]
            properties:
              success: { const: false }
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
    Deleted:
      description: Entry deleted
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data:
                type: object
                required: [deleted]
                properties:
                  deleted: { const: true }
    Listing:
      description: Paginated filesystem listing
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [file_name, source, type, size]
                      properties:
                        file_name: { type: string }
                        source: { type: string }
                        type: { enum: [file, directory] }
                        size: { type: integer, minimum: 0 }
                  pagination:
                    type: object
                    required: [page, limit, total]
                    properties:
                      page: { type: integer, minimum: 1 }
                      limit: { type: integer, minimum: 1, maximum: 100 }
                      total: { type: integer, minimum: 0 }
